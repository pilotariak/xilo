[header]
path = "hack/header.txt"

[files]
includes = [
  "*.ts",
  "*.tsx",
  "*.yml",
  "*.yaml",
  "*.toml",
  "*.sh",
  "Makefile",
]

excludes = [
  "hack/header.txt",
  "*.json",
  "vendor/*",
  "node_modules/*",
  "dist/*",
  "build/*",
  ".git/*",
]
